[package]
name = "dynamic-config-node-remote"
# Its own version, and it moves with the base package: this package hands
# documents to `dynamic-config-node`, and a gap between them is a pair
# nobody built.
version = "0.0.1"
edition.workspace = true
rust-version = "1.88"
license.workspace = true
description = "The Rust remote stores for dynamic-config's Node bindings, as a second package"
repository.workspace = true
readme = "README.md"
# Never on crates.io: a cdylib addon has no Rust consumers. It ships to npm
# as `dynamic-config-node-remote`.
publish = false


[lib]
crate-type = ["cdylib"]

[dependencies]
# The engine, for `Error`, `Fetched` and `Format`. This package never *loads*
# a configuration: it hands a document to the base package, which does.
dynamic-config = { workspace = true, features = ["async", "json", "toml", "yaml"] }
# The shared redaction, so a store URL loses its password by the same rule
# here as in the store crates rather than by a second copy of it.
dynamic-config-store-core = { workspace = true }
# The eight stores, from crates.io. The versions and the two `tls` features
# are named once in the workspace manifest — `tls` because an addon is
# compiled weeks before anybody installs it, so there is no later moment at
# which a user could turn one on.
dynamic-config-consul = { workspace = true }
dynamic-config-etcd = { workspace = true }
dynamic-config-firestore = { workspace = true }
dynamic-config-git = { workspace = true }
dynamic-config-nats = { workspace = true }
dynamic-config-redis = { workspace = true }
dynamic-config-s3 = { workspace = true }
dynamic-config-vault = { workspace = true }
# Floors that resolve, rather than a bare `"3"`: the minimal-versions
# gate picks the *lowest* version of every direct dependency, and
# `napi 3.0` wants a `napi-build` newer than `"2"` would pick.
napi = { version = "3.3", default-features = false, features = ["napi6", "serde-json"] }
napi-derive = "3.2"
serde_json = "1.0.149"
# etcd and NATS are async clients; a fetch from this package is a blocking
# call on a worker thread, so it needs a runtime to drive them. The same
# reason the Python remote wheel carries one.
# `1.47`, the floor its siblings declare: a looser `"1"` here makes
# `-Z direct-minimal-versions` pick 1.0 for this crate and conflict with
# the store crates in the same lockfile.
tokio = { version = "1.47", features = ["rt-multi-thread"] }

[build-dependencies]
napi-build = "2.2.3"
