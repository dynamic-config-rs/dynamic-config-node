name: CI

# No push trigger at all: everything travels through a pull request, and
# main only ever receives a SQUASH of a green PR — the squashed tree is
# byte-identical to the PR head the checks already ran on, so a main
# re-run would test the same content twice. Merging runs release.yml
# alone; workflow_dispatch stays as the manual escape hatch.
on:
  pull_request:
  workflow_dispatch:

# One run cancels the previous on the same ref: a pull request pushed three
# times in a minute should not occupy three runners proving the same thing
# about two obsolete commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # A failing build should say what failed, not where in a backtrace it gave up.
  RUST_BACKTRACE: 1

jobs:
  conformance:
    name: the three languages agree
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The engine's conformance cases, at a PINNED ref — see the python
      # repository's twin job for the reasoning.
      - run: |
          ref="v0.8.0"
          curl -sSL "https://github.com/dynamic-config-rs/dynamic-config/archive/refs/tags/${ref}.tar.gz" \
            | tar -xz --strip-components=1 --wildcards '*/conformance/'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5
        with:
          node-version: "22"
      - run: npm install --no-save --no-fund --no-audit dynamic-config-node
      - run: >-
          CONFORMANCE_DIR=conformance/cases
          CONFORMANCE_PACKAGE=dynamic-config-node
          node scripts/conformance.mjs

  # What changed, so the expensive jobs below can sit out a run that cannot
  # affect them. Deliberately a *job* rather than `on.pull_request.paths`:
  # a workflow filtered out at the trigger never reports at all, and a
  # required check that never reports leaves the pull request waiting for
  # ever. A skipped job passes the gate instead — `ci-ok` matches `failure`
  # and `cancelled` only, which the `supply-chain` job in security.yml has
  # relied on since it was written.
  # Filtering applies to pull requests only. A push to `main` and a manual
  # dispatch run everything: `main` is what releases from, and a manual
  # dispatch has no base commit for a path filter to compare against.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      js: ${{ steps.filter.outputs.js }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rustfmt.toml'
              - 'deny.toml'
              - '.cargo/**'
              - '.github/workflows/**'
            js:
              - '**/*.rs'
              - '**/*.js'
              - '**/*.mjs'
              - '**/*.ts'
              - '**/package.json'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/**'
            docs:
              - '**/*.md'
              - 'book/**'
              - '.github/workflows/**'

  fmt:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A hung job should fail, not sit on a runner for six hours.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A hung job should fail, not sit on a runner for six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # `etcd-client` compiles its gRPC stubs at build time and needs the
      # `protoc` binary, which the runner image does not carry. The stores
      # addon is the crate that pulls it in.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # `--lib` on purpose: a cdylib that links no Node has no test target,
      # so `--all-targets` over the workspace cannot reach either crate.
      - run: cargo clippy -p dynamic-config-node --lib --all-features
      - run: cargo clippy -p dynamic-config-node-remote --lib --all-features
  node-macos:
    needs: [changes]
    if: needs.changes.outputs.js == 'true' || github.event_name != 'pull_request'
    # macOS ran only in the RELEASE prebuild matrix, which is how an
    # FSEvents-only failure shipped its way to a red release run before
    # any pull request could see it. One macOS leg here closes that gap;
    # one Node line suffices — the per-line claims are the linux matrix's.
    name: the Node bindings on macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5
        with:
          node-version: "22"
      - run: cargo build -p dynamic-config-node --release
      - run: cp target/release/libdynamic_config_node.dylib dynamic-config-node/index.node
      - run: node --test tests/*.test.js
        working-directory: dynamic-config-node
  node:
    needs: [changes]
    if: needs.changes.outputs.js == 'true' || github.event_name != 'pull_request'
    name: the Node bindings
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Every line the package claims. Node-API is ABI-stable across
        # them, which is the whole reason this binding is napi-rs and not
        # a per-version build — but "ABI-stable" is a claim about the
        # addon, and the JavaScript half is ordinary code that a version
        # can break.
        node: ["18", "20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5
        with:
          node-version: ${{ matrix.node }}
      - run: cargo build -p dynamic-config-node --release
      - run: cp target/release/libdynamic_config_node.so dynamic-config-node/index.node
      - run: node --test tests/*.test.js
        working-directory: dynamic-config-node
      # The examples are documentation people run, so they run here. Three
      # of them want a framework; they say so and exit cleanly without one,
      # which is why they are installed rather than skipped.
      - run: npm install --no-save --no-fund --no-audit express fastify zod typescript
        working-directory: dynamic-config-node
      # The types a caller sees, checked the way their CI checks them: a
      # regression here is invisible to a test suite, because
      # `config.current().host` runs perfectly well while the checker calls
      # it `unknown` and the editor offers no completion.
      - name: the types, under strict
        working-directory: dynamic-config-node
        run: |
          npx tsc -p tests/typing/tsconfig.json
          npx tsc -p examples/tsconfig.json
      - name: every example
        working-directory: dynamic-config-node
        run: |
          for example in examples/*.mjs; do
            echo "── $example"
            node "$example" > /dev/null
          done

  node-remote:
    needs: [changes]
    if: needs.changes.outputs.js == 'true' || github.event_name != 'pull_request'
    name: the Node stores
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v5
        with:
          node-version: "22"
      # etcd's client compiles its gRPC stubs at build time and needs
      # `protoc`, which the runner image does not carry.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # One version rather than the base package's matrix: this addon has no
      # JavaScript half worth speaking of — eight constructors and a bridge —
      # and it is the slowest thing in this workflow to build.
      #
      # The recipe's steps, written out: nothing else in this workflow
      # installs `just`, and a job that needed a task runner to run three
      # commands would be the first.
      - run: cargo build -p dynamic-config-node-remote --release
      - run: cp target/release/libdynamic_config_node_remote.so dynamic-config-node-remote/index.node
      - name: the base package, linked the way npm would install it
        run: |
          mkdir -p dynamic-config-node-remote/node_modules
          ln -sfn ../../dynamic-config-node dynamic-config-node-remote/node_modules/dynamic-config-node
      # The base package needs its own binary too: the stores' suite imports
      # `DynamicConfigError` from it.
      - run: cargo build -p dynamic-config-node --release
      - run: cp target/release/libdynamic_config_node.so dynamic-config-node/index.node
      - run: node --test tests/*.test.js
        working-directory: dynamic-config-node-remote

  msrv:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    name: the declared floor compiles
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The 0.7 store crates reach `etcd-client`, whose build script
      # compiles protos and needs the `protoc` binary — absent from
      # the runner image, exactly as in the build jobs above.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      # A lockfile resolved by stable, then checked by the floor — the
      # combination a user's `npm install` + our build actually produces.
      - run: cargo generate-lockfile
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: msrv
      # One floor since the 1.88 raise. `--lib`: the addons have no test
      # targets on the Rust side, and dev dependencies track stable.
      - run: cargo +1.88 check -p dynamic-config-node --locked --lib
      - run: cargo +1.88 check -p dynamic-config-node-remote --locked --lib

  docs:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    name: rustdoc is clean
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The 0.7 store crates reach `etcd-client`, whose build script
      # compiles protos and needs the `protoc` binary — absent from
      # the runner image, exactly as in the build jobs above.
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: check
      - run: cargo doc --workspace --no-deps

  docs-links:
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || github.event_name != 'pull_request'
    name: documentation links resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A README is the first thing anyone reads and the last thing anyone
      # tests. A dead anchor in it is a small bug that is very easy to ship.
      # npmjs.com answers a bot with 403 whether or not the package exists,
      # so those links are right for a reader and uncheckable from CI.
      # (The exclusions live inside the folded block below, where a `#`
      # would be an argument rather than a comment.)
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --include-fragments
            --max-retries 3
            --retry-wait-time 5
            --exclude '^https://github\.com/dynamic-config-rs/'
            --exclude '^https://docs\.rs/dynamic-config'
            --exclude '^https://dynamic-config-rs\.github\.io'
            --exclude '^https://www\.npmjs\.com/'
            README.md CONTRIBUTING.md SECURITY.md RELEASING.md
            AGENTS.md scripts/README.md
            dynamic-config*/README.md dynamic-config*/CHANGELOG.md
            book/src/*.md dynamic-config-node/examples/*/*.md
            .claude/skills/*/SKILL.md
          fail: true

  actionlint:
    name: workflows lint clean
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # The workflows are code that only runs in production. actionlint
      # catches the typo'd `if:` expression and the misspelled input before a
      # release does.
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

  # The one status branch protection requires. Requiring every job by name
  # breaks the moment a matrix row is renamed; requiring this gate never
  # does. `if: always()` because a gate that is skipped when a dependency
  # fails would count as "not failed" and wave the merge through.
  ci-ok:
    name: CI is green
    needs:
      - changes
      - fmt
      - clippy
      - node
      - node-macos
      - node-remote
      - msrv
      - docs
      - docs-links
      - actionlint
      - conformance
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job this gate needs has succeeded
        run: |
          results='${{ toJSON(needs.*.result) }}'
          echo "$results"
          case "$results" in
            *failure*|*cancelled*) exit 1 ;;
          esac
